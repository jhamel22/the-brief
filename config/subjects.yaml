# The Brief — subject configuration
#
# daily_cap: max papers to summarize per run. Keeps API costs predictable.
#   At ~$0.007/paper (Sonnet 4.6), 20 papers/day ≈ $4/month per subject.
#   Budget headroom at $15-20/month: ~60-70 papers/day across all active subjects.
#
# prompt_variant: which prompt template to use (ingest/prompts/{variant}.txt)
#   physics | cs | math | bio | finance | econ
#
# active: false = config is ready but ingestion is paused
#
# To add a new subject: copy a block, set active: true, adjust daily_cap.

subjects:

  # ── PHYSICS ──────────────────────────────────────────────
  - code: gr-qc
    name: General Relativity & Quantum Cosmology
    domain: Physics
    slug: gr-qc
    daily_cap: 15
    prompt_variant: physics
    description: "Black holes, gravitational waves, and the fabric of spacetime — the latest research, summarized daily. Always verify against the source."
    active: true

  - code: hep-th
    name: High Energy Physics — Theory
    domain: Physics
    slug: hep-th
    daily_cap: 10
    prompt_variant: physics
    description: "String theory, quantum field theory, holography, and the deep mathematical structure of fundamental physics — summarized daily. Always verify against the source."
    active: true

  - code: quant-ph
    name: Quantum Physics
    domain: Physics
    slug: quant-ph
    daily_cap: 10
    prompt_variant: physics
    description: "Entanglement, quantum computing, quantum information, and the strange behavior of matter at the smallest scales — summarized daily. Always verify against the source."
    active: true

  - code: astro-ph.CO
    name: Cosmology
    domain: Physics
    slug: astro-ph-co
    daily_cap: 20
    prompt_variant: physics
    description: "The large-scale structure of the universe, dark matter, dark energy, and the cosmic microwave background — summarized daily. Always verify against the source."
    active: true

  - code: hep-ph
    name: High Energy Physics — Phenomenology
    domain: Physics
    slug: hep-ph
    daily_cap: 15
    prompt_variant: physics
    active: false

  - code: cond-mat
    name: Condensed Matter
    domain: Physics
    slug: cond-mat
    daily_cap: 15
    prompt_variant: physics
    active: false

  - code: physics.soc-ph
    name: Physics and Society
    domain: Physics
    slug: physics-soc-ph
    daily_cap: 8
    prompt_variant: physics
    description: "Physics applied to social systems — networks, epidemics, inequality, collective behavior — summarized daily. Always verify against the source."
    active: true

  # ── COMPUTER SCIENCE ──────────────────────────────────────
  # Note: cs.LG/cs.AI/cs.CL can each hit 150-200 papers/day.
  # daily_cap is critical here. These use a two-step pipeline:
  # Haiku ranks abstracts cheaply, then Sonnet summarizes the top N.
  - code: cs.LG
    name: Machine Learning
    domain: Computer Science
    slug: cs-lg
    daily_cap: 20
    prompt_variant: cs
    description: "Neural networks, optimization, generalization, and the mathematical foundations of learning — the best of machine learning research, summarized daily. Always verify against the source."
    use_filter: true   # enables cheap pre-ranking step for high-volume subjects
    model: haiku
    active: true

  - code: cs.AI
    name: Artificial Intelligence
    domain: Computer Science
    slug: cs-ai
    daily_cap: 15
    prompt_variant: cs
    description: "Agents, reasoning, foundation models, and the latest from the AI research frontier — summarized daily. Always verify against the source."
    use_filter: true
    model: haiku
    active: true

  - code: cs.CL
    name: Computation and Language
    domain: Computer Science
    slug: cs-cl
    daily_cap: 12
    prompt_variant: cs
    description: "Large language models, translation, dialogue, and the computational study of human language — summarized daily. Always verify against the source."
    use_filter: true
    model: haiku
    active: true

  - code: cs.CV
    name: Computer Vision
    domain: Computer Science
    slug: cs-cv
    daily_cap: 20
    prompt_variant: cs
    use_filter: true
    model: haiku
    active: true

  - code: cs.RO
    name: Robotics
    domain: Computer Science
    slug: cs-ro
    daily_cap: 15
    prompt_variant: cs
    use_filter: true
    model: haiku
    active: true

  # ── MATHEMATICS ───────────────────────────────────────────
  - code: math.NT
    name: Number Theory
    domain: Mathematics
    slug: math-nt
    daily_cap: 15
    prompt_variant: math
    active: false

  - code: math.AG
    name: Algebraic Geometry
    domain: Mathematics
    slug: math-ag
    daily_cap: 15
    prompt_variant: math
    active: false

  # ── OTHER FIELDS ──────────────────────────────────────────
  - code: q-bio.NC
    name: Neurons and Cognition
    domain: Quantitative Biology
    slug: q-bio-nc
    daily_cap: 8
    prompt_variant: bio
    description: "Neuroscience, brain-computer interfaces, and the computational study of the mind — summarized daily. Always verify against the source."
    active: true

  - code: q-fin
    name: Quantitative Finance
    domain: Quantitative Finance
    slug: q-fin
    daily_cap: 10
    prompt_variant: finance
    active: false

  - code: econ.GN
    name: General Economics
    domain: Economics
    slug: econ-gn
    daily_cap: 8
    prompt_variant: econ
    description: "Economic theory, policy, and empirical research in plain English — summarized daily. Always verify against the source."
    active: true
